<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="login-page">
  <section class="welcome-panel" aria-label="Boas-vindas">
    <h1>Seja Bem-vindo</h1>
    <div class="img">
      <img src="img/mesa.png">
    </div>
  </section>

  <main class="login-panel">
    <section class="login-box">
      <h2>Login</h2>
      <form id="login-form">
        <label for="email">Usuário</label>
        <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <a class="forgot-link" href="/recuperar-senha.html">Esqueceu a senha?</a>
        <button class="primary-button" type="submit">Entrar</button>
        <p id="mensagem" class="message" role="status" aria-live="polite"></p>
      </form>
      <a class="register-button" href="/cadastro.html">Cadastro</a>
    </section>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
