<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Sistemas</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="register-page">
  <main class="register-card">
    <h1>Crie sua conta</h1>
    <form id="cadastro-form">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" autocomplete="name" required minlength="2" maxlength="100">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
      <small>A senha deve ter pelo menos 8 caracteres.</small>
      <button class="primary-button" type="submit">Cadastrar</button>
      <p id="mensagem" class="message" role="status" aria-live="polite"></p>
    </form>
    <a class="back-link" href="/login.html">Voltar ao login</a>
  </main>
  <script src="/js/cadastro.js" defer></script>
</body>
</html>
